name: Deploy backend

# 推 main → 测试全绿 → rsync 上服务器 → uv sync → 重启 → 健康检查。
# 部署不取消排队（cancel-in-progress: false）——半截部署比慢部署可怕。
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  REMOTE_DIR: /opt/sgu-acw-api
  UV_BIN: /root/.local/bin/uv

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests

      - name: Tests
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.SGU_ACW_SSH_KEY }}
          SSH_HOST: ${{ secrets.SGU_ACW_SSH_HOST }}
          SSH_USER: ${{ secrets.SGU_ACW_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | python3 -c "import sys; sys.stdout.write(sys.stdin.read().replace('\r\n', '\n').strip() + '\n')" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          # Same pinned production host keys as the frontend deploy workflow.
          # ssh-keyscan intermittently fails from GitHub runners.
          printf '%s\n' \
            '154.9.228.109 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOueouNQCFoKLYn0EkXUyp4uRdSzC4Lq2x23nfS9wD6w' \
            '154.9.228.109 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBHqfRQzBYzSuGi1VB9trjC+clDp5J5QRTd+4bf0Vkxd0rqj9x2ipgRodyp+Ty4Fp2kF6VkglrS3Uj7ht7f2Loa0=' \
            > ~/.ssh/known_hosts
          printf 'Host deploy-target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Rsync and restart
        run: |
          rsync -az --delete-delay \
            -e ssh \
            app/ "deploy-target:$REMOTE_DIR/app/"
          rsync -az \
            -e ssh \
            pyproject.toml uv.lock "deploy-target:$REMOTE_DIR/"
          ssh deploy-target \
            "cd $REMOTE_DIR \
              && $UV_BIN sync --frozen \
              && .venv/bin/python -m compileall -q app \
              && systemctl restart sgu-acw-api.service \
              && for attempt in \$(seq 1 30); do \
                curl -fsS --max-time 2 http://127.0.0.1:8091/api/healthz && exit 0; \
                sleep 2; \
              done; \
              journalctl -u sgu-acw-api.service -n 40 --no-pager; exit 1"
